<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GARP Member Portal — manage your FRM, SCR, RAI, and membership programs, study materials, events, and account."
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <!-- Pre-JS splash (public/) — before Vite CSS; keeps index.html free of style blocks. -->
    <link rel="stylesheet" href="./boot.css" />
    <!-- First-party brand assets (long-cache via Vite / public/). -->
    <link rel="preconnect" href="https://www.garp.org" crossorigin />
    <link rel="dns-prefetch" href="https://www.garp.org" />
    <link
      rel="preload"
      href="./brand/garp-logo-short-knockout.png"
      as="image"
      fetchpriority="high"
    />
    <!-- FOUC: apply persisted theme before paint (same key as theme-store). -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("garpportal-theme")
          var mode = "system"
          var palette = "default"
          if (raw) {
            var parsed = JSON.parse(raw)
            var source = parsed && parsed.state ? parsed.state : parsed
            if (source && (source.mode === "light" || source.mode === "dark" || source.mode === "system")) {
              mode = source.mode
            }
            if (source && source.palette === "default") {
              palette = source.palette
            }
          }
          var preferDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          var resolved =
            mode === "system" ? (preferDark ? "dark" : "light") : mode
          var root = document.documentElement
          root.classList.remove("light", "dark")
          root.classList.add(resolved)
          root.setAttribute("data-theme", palette)
          root.style.colorScheme = resolved
        } catch (_) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div
        id="boot-splash"
        role="status"
        aria-busy="true"
        aria-label="Loading GARP"
        aria-hidden="true"
      >
        <img
          src="./brand/garp-logo-full-knockout.png"
          alt="GARP - Global Association of Risk Professionals"
        />
        <div class="boot-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script>
      (function () {
        var BOOT_SPLASH_DELAY_MS = 200
        var splash = document.getElementById("boot-splash")
        if (!splash) return
        window.setTimeout(function () {
          if (!splash.isConnected) return
          splash.classList.add("boot-splash--visible")
          splash.setAttribute("aria-hidden", "false")
        }, BOOT_SPLASH_DELAY_MS)
      })()
    </script>
    <script type="module" src="src/app.tsx"></script>
  </body>
</html>
